	<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Collezione Marco Vedovato - Reindirizzamento</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('sfondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }
        .loader-card {
            background-color: #1a2233;
            color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid #2d3748;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #f7fafc;
        }
        p {
            color: #a0aec0;
            font-size: 14px;
        }
        .spinner {
            margin: 20px auto 0 auto;
            width: 40px;
            height: 40px;
            border: 4px solid #2d3748;
            border-top: 4px solid #d69e2e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 800;

            const linkPC = "https://script.google.com/macros/s/AKfycbzivl1OuowVsY0j9MNhE1oJpHsk4xv_OJPJUGJzMC_Vzs0rRDd3-HLi4njYpjWutNmKgQ/exec?vista=pc";
            const linkMobile = "https://script.google.com/macros/s/AKfycbzivl1OuowVsY0j9MNhE1oJpHsk4xv_OJPJUGJzMC_Vzs0rRDd3-HLi4njYpjWutNmKgQ/exec";

            setTimeout(() => {
                if (isMobile) {
                    window.location.replace(linkMobile);
                } else {
                    window.location.replace(linkPC);
                }
            }, 600);
        });
    </script>
</head>
<body>

    <div class="loader-card">
        <h2>Collezione Marco Vedovato</h2>
        <p>Fondo storico Prof. Aristocle Vatova</p>
        <p style="color: #cbd5e0; margin-top: 20px;">Caricamento database in corso...</p>
        <div class="spinner"></div>
    </div>

</body>
</html>
