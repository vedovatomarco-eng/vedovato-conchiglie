<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collezione Marco Vedovato - Database Malacologico</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-image: url('sfondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b131e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0;
            font-weight: normal;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <h2>Caricamento Collezione Malacologica in corso...</h2>

    <script>
        // Rileva automaticamente se l'utente sta usando uno smartphone o un PC
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 800;
        
        const urlPC = "https://script.google.com/macros/s/AKfycbzivl1OuowVsY0j9MNhE1oJpHsk4xv_OJPJUGJzMC_Vzs0rRDd3-HLi4njYpjWutNmKgQ/exec?vista=pc";
        const urlMobile = "https://script.google.com/macros/s/AKfycbzivl1OuowVsY0j9MNhE1oJpHsk4xv_OJPJUGJzMC_Vzs0rRDd3-HLi4njYpjWutNmKgQ/exec";

        // Reindirizzamento immediato e pulito verso la versione corretta (PC o Mobile)
        setTimeout(function() {
            window.location.replace(isMobile ? urlMobile : urlPC);
        }, 400); // 400 millisecondi per mostrare la schermata grafica coordinata prima del passaggio
    </script>

</body>
</html>
