<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collezione Marco Vedovato - Database Malacologico</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-image: url('sfondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0b131e;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            z-index: 10;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top: 5px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
            error { display: none; }
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Caricamento Collezione...</h2>
    </div>

    <iframe id="dbFrame" onload="document.getElementById('loading-screen').style.display='none';"></iframe>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 800;
        
        const urlPC = "https://script.google.com/macros/s/AKfycbzivl1OuowVsY0j9MNhE1oJpHsk4xv_OJPJUGJzMC_Vzs0rRDd3-HLi4njYpjWutNmKgQ/exec?vista=pc";
        const urlMobile = "https://script.google.com/macros/s/AKfycbzivl1OuowVsY0j9MNhE1oJpHsk4xv_OJPJUGJzMC_Vzs0rRDd3-HLi4njYpjWutNmKgQ/exec";

        document.getElementById('dbFrame').src = isMobile ? urlMobile : urlPC;
    </script>

</body>
</html>
