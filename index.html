<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Collezione Marco Vedovato - Database Malacologico</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-image: url('sfondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }
        .frame-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="frame-container">
        <iframe id="dbFrame"></iframe>
    </div>

    <script>
        // Rileva se è un dispositivo mobile o un PC e carica il link corrispondente dentro l'iframe
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 800;

        const linkPC = "https://script.google.com/macros/s/AKfycbzivl1OuowVsY0j9MNhE1oJpHsk4xv_OJPJUGJzMC_Vzs0rRDd3-HLi4njYpjWutNmKgQ/exec?vista=pc";
        const linkMobile = "https://script.google.com/macros/s/AKfycbzivl1OuowVsY0j9MNhE1oJpHsk4xv_OJPJUGJzMC_Vzs0rRDd3-HLi4njYpjWutNmKgQ/exec";

        document.getElementById('dbFrame').src = isMobile ? linkMobile : linkPC;
    </script>

</body>
</html>
